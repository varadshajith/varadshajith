name: Rebuild status card

on:
  schedule:
    - cron: "17 2 * * *"      # 07:47 IST daily
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - "card.json"            # rebuild immediately when you edit the content
      - "scripts/build_card.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install fonttools brotli

      - name: Rebuild card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_card.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain assets/now.svg)" ]]; then
            git add assets/now.svg
            git commit -m "card: refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change"
          fi
